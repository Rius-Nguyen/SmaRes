<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>SmaRes - Demo Đăng Nhập & Bảo Mật</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background: #eef2f5; }
    nav { display: flex; justify-content: space-between; background: #1e293b; color: white; padding: 15px 30px; align-items: center; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .nav-brand { font-size: 22px; font-weight: bold; }
    .btn { padding: 10px 18px; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: 600; transition: 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-danger { background: #ef4444; }
    .btn-success { background: #10b981; }
    .box { margin-top: 25px; padding: 25px; background: white; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); max-width: 420px; }
    input { display: block; width: 92%; margin-bottom: 12px; padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
    input:focus { border-color: #3b82f6; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <div class="nav-brand">SmaRes 🍽️</div>
    <div id="navbar-auth"><span style="color: #94a3b8;">Đang kiểm tra...</span></div>
  </nav>

  <!-- FORM ĐĂNG KÝ -->
  <div class="box">
    <h3 style="margin-top:0;">1. Đăng Ký Tài Khoản</h3>
    <input id="regName" placeholder="Họ và tên" value="Nguyễn Văn A">
    <input id="regEmail" placeholder="Email" value="nva@gmail.com">
    <input id="regPhone" placeholder="Số điện thoại" value="0987654321">
    <input type="password" id="regPass" placeholder="Mật khẩu" value="123456">
    <button class="btn" onclick="register()">Đăng ký tài khoản</button>
  </div>

  <!-- FORM ĐĂNG NHẬP -->
  <div class="box">
    <h3 style="margin-top:0;">2. Đăng Nhập</h3>
    <input id="logEmail" placeholder="Email" value="nva@gmail.com">
    <input type="password" id="logPass" placeholder="Mật khẩu" value="123456">
    <button class="btn btn-success" onclick="login()">Đăng nhập ngay</button>
  </div>

  <script>
    const API_URL = 'http://127.0.0.1:5000/api/auth';
    const fetchOptions = { credentials: 'include', headers: { 'Content-Type': 'application/json' } };

    // HÀM CẬP NHẬT TRẠNG THÁI NAVBAR
    async function updateNavbar() {
      const navAuth = document.getElementById('navbar-auth');
      try {
        const res = await fetch(`${API_URL}/me`, { method: 'GET', credentials: 'include' });
        
        if (res.ok) {
          const data = await res.json();
          // Đã đăng nhập -> Hiện Tên và Nút Đăng xuất
          navAuth.innerHTML = `
            <span style="margin-right: 15px; color: #e2e8f0;">Xin chào, <b>${data.user.full_name}</b> (${data.user.role_id.role_name})</span>
            <button class="btn btn-danger" onclick="logout()">Đăng xuất</button>
          `;
        } else {
          // Chưa đăng nhập
          navAuth.innerHTML = `<span style="color: #f87171; font-weight:600;">Chưa đăng nhập</span>`;
        }
      } catch (err) {
        navAuth.innerHTML = `<span style="color: #f87171; font-weight:600;">Chưa đăng nhập</span>`;
      }
    }

    // XỬ LÝ ĐĂNG KÝ
    async function register() {
      const body = JSON.stringify({
        full_name: document.getElementById('regName').value,
        email: document.getElementById('regEmail').value,
        phone: document.getElementById('regPhone').value,
        password: document.getElementById('regPass').value
      });
      const res = await fetch(`${API_URL}/register`, { ...fetchOptions, method: 'POST', body });
      const data = await res.json();
      alert(data.message || data.error);
    }

    // XỬ LÝ ĐĂNG NHẬP
    async function login() {
      const body = JSON.stringify({
        email: document.getElementById('logEmail').value,
        password: document.getElementById('logPass').value
      });
      const res = await fetch(`${API_URL}/login`, { ...fetchOptions, method: 'POST', body });
      const data = await res.json();
      
      alert(data.message || data.error);
      if(res.ok) updateNavbar(); // Đổi giao diện Navbar ngay lập tức
    }

    // XỬ LÝ ĐĂNG XUẤT
    async function logout() {
      await fetch(`${API_URL}/logout`, { method: 'POST', credentials: 'include' });
      alert("Đã đăng xuất!");
      updateNavbar(); // Trở về trạng thái chưa đăng nhập
    }

    // Tự động chạy khi tải trang
    document.addEventListener('DOMContentLoaded', updateNavbar);
  </script>
</body>
</html>
